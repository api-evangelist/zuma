aid: zuma
name: Zuma
description: >-
  Zuma (legally Resident Boost Inc., d/b/a Zuma) is an AI platform for the
  multifamily / apartment industry, best known for "Kelsey," an AI assistant
  with human back-up that handles renter engagement across the resident
  lifecycle. Kelsey automates leasing (responding to inquiries, qualifying
  prospects, and scheduling tours), rent collections (payment reminders,
  late-resident follow-up, and commitment tracking), move-outs (notices,
  inspections, and security-deposit handling), and inbound property calls via
  VoiceAI. Zuma integrates into property-management and CRM systems used by
  operators — Yardi, RealPage, Entrata, Knock, and Microsoft/Google calendars —
  to boost NOI and conversion. The company is backed by Andreessen Horowitz
  (a16z). Zuma does not currently publish a public developer API, developer
  portal, or API reference; this profile captures its public web, commercial,
  and operational surface.
